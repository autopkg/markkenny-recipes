Description: Download the latest release of the OpenWebStart installer from GitHub. Taken from NStraus and added platform running on YML
Identifier: com.github.markkenny.autopkg.download.OpenWebStart
MinimumVersion: "2.3"

Input:
  NAME: OpenWebStart

Process:
- Processor: GitHubReleasesInfoProvider
  Arguments:
    asset_regex: ^.*(macos-%ARCH%).*$
    github_repo: karakun/OpenWebStart

- Processor: URLDownloader
  Arguments:
    filename: OpenWebStart-%ARCH%-%version%.dmg

- Processor: EndOfCheckPhase

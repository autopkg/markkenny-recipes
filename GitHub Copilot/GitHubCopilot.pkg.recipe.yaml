Comment: Created by MK
Description: Downloads the latest version of GitHub Copilot and creates a package.
Identifier: com.github.markkenny.autopkg.pkg.githubcopilot
ParentRecipe: com.github.markkenny.autopkg.download.githubcopilot
MinimumVersion: "2.3"

Input:
  NAME: GitHub Copilot

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: '%pathname%/GitHub Copilot.app'
      pkg_path: '%RECIPE_CACHE_DIR%/%NAME%-%ARCH%-%version%.pkg'

